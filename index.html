<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#050505" />
<title>TraceCam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#f6f1e8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}.app{position:fixed;inset:0;background:#050505}.stage{position:absolute;inset:0;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hud{position:absolute;z-index:4;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(0,0,0,.62);backdrop-filter:blur(18px)}h1{margin:0;font-size:21px;line-height:1}p{margin:5px 0 0;color:rgba(246,241,232,.68);font-size:13px}.icon,.secondary,#start{border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.1);color:#f6f1e8}.icon{width:42px;height:42px;font-size:22px}.dim{position:absolute;z-index:2;top:0;bottom:0;background:rgba(0,0,0,.32);pointer-events:none}.dim.l{left:0;right:calc(50% + 12px)}.dim.r{right:0;left:calc(50% + 12px)}.slit{position:absolute;z-index:3;top:0;bottom:0;left:50%;width:24px;transform:translateX(-50%);border-left:1px solid rgba(255,255,255,.86);border-right:1px solid rgba(255,255,255,.86);box-shadow:0 0 35px rgba(255,255,255,.35),inset 0 0 25px rgba(255,255,255,.15);background:rgba(255,255,255,.04);pointer-events:none}.slit.h{left:0;right:0;top:50%;bottom:auto;width:auto;height:24px;transform:translateY(-50%);border-left:0;border-right:0;border-top:1px solid rgba(255,255,255,.86);border-bottom:1px solid rgba(255,255,255,.86)}.progress{position:absolute;z-index:5;left:14px;right:14px;bottom:calc(258px + env(safe-area-inset-bottom));height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}.bar{height:100%;width:0;background:#fff}.preview{position:absolute;z-index:5;right:14px;bottom:calc(154px + env(safe-area-inset-bottom));width:116px;height:154px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#050505;display:grid;place-items:center;box-shadow:0 18px 70px rgba(0,0,0,.45)}.preview canvas{width:100%;height:100%;object-fit:cover}.preview span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:rgba(246,241,232,.6);font-size:12px}.controls{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.9) 18%,#050505)}.row{display:grid;gap:8px;margin-bottom:10px}.compact{grid-template-columns:1fr 1fr}.sliders{grid-template-columns:1fr 1fr 1fr}label{display:grid;gap:6px;color:rgba(246,241,232,.68);font-size:11px}select{width:100%;border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:9px 10px;background:rgba(255,255,255,.1);color:#f6f1e8}input{width:100%;accent-color:#fff}.shutterRow{display:grid;grid-template-columns:1fr 92px 1fr;gap:16px;align-items:center}.secondary{height:46px}.shutter{width:86px;height:86px;border-radius:999px;border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.08);display:grid;place-items:center}.shutter span{width:62px;height:62px;border-radius:999px;background:#fff;transition:.12s}.shutter.on span{transform:scale(.72);border-radius:20px;background:#ff4a4a}.card{position:absolute;z-index:20;inset:18px;margin:auto;max-width:420px;height:max-content;padding:24px;border-radius:28px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.84);backdrop-filter:blur(24px)}.card.hide{display:none}.card h2{margin:0;font-size:24px}.card p{font-size:15px;margin-bottom:18px}#start{width:100%;height:52px;background:#fff;color:#050505;font-weight:700}small{display:block;text-align:center;margin-top:14px;color:rgba(246,241,232,.58)}.hidden{display:none}@media(min-width:800px){.stage{position:relative;width:min(430px,100vw);height:min(932px,100vh);margin:auto;border-radius:32px;border:1px solid rgba(255,255,255,.12)}}
</style>
</head>
<body>
<main class="app"><section class="stage"><video id="video" playsinline autoplay muted></video><canvas id="live" class="hidden"></canvas><div class="dim l"></div><div class="dim r"></div><div id="slit" class="slit"></div><div class="hud"><div><h1>TraceCam</h1><p id="status">Move your phone like a handheld scanner.</p></div><button id="restart" class="icon">↻</button></div><div class="progress"><div id="bar" class="bar"></div></div><div class="preview"><canvas id="out"></canvas><span id="empty">Your trace appears here</span></div><div class="controls"><div class="row compact"><label>Mode<select id="mode"><option value="vertical">Vertical slit</option><option value="horizontal">Horizontal slit</option></select></label><label>Direction<select id="dir"><option value="forward">Forward</option><option value="reverse">Reverse</option></select></label></div><div class="row sliders"><label>Width <b id="wv">6</b><input id="width" type="range" min="2" max="32" value="6"></label><label>Speed <b id="sv">1</b><input id="speed" type="range" min="1" max="8" value="1"></label><label>Glitch <b id="gv">8</b>%<input id="glitch" type="range" min="0" max="35" value="8"></label></div><div class="shutterRow"><button id="retake" class="secondary">Retake</button><button id="shutter" class="shutter"><span></span></button><button id="save" class="secondary">Save</button></div></div></section><div id="permission" class="card"><h2>TraceCam needs camera access</h2><p>Use the iPhone back camera, hold the shutter, and slowly move across a face, object, or document.</p><button id="start">Start camera</button><small>Best on iPhone Safari or Chrome over HTTPS.</small></div></main>
<script>
const $=id=>document.getElementById(id),v=$('video'),live=$('live'),out=$('out'),lctx=live.getContext('2d',{willReadFrequently:true}),octx=out.getContext('2d');let stream=null,scanning=false,raf=0,cursor=0,last=0,has=false,url=null;const size={vertical:[1800,2400],horizontal:[2400,1800]};function mode(){return $('mode').value}function rev(){return $('dir').value==='reverse'}function slit(){return +$('width').value}function speed(){return +$('speed').value}function glitch(){return +$('glitch').value/100}function labels(){$('wv').textContent=slit();$('sv').textContent=speed();$('gv').textContent=$('glitch').value;$('slit').classList.toggle('h',mode()==='horizontal');$('status').textContent=mode()==='horizontal'?'Hold shutter and move up or down slowly.':'Hold shutter and move left or right slowly.'}async function camera(){stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});v.srcObject=stream;await v.play();$('permission').classList.add('hide');$('status').textContent='Ready. Hold the shutter to trace.'}catch(e){$('permission').classList.remove('hide');alert('Could not open camera. Allow camera permission and use HTTPS.');console.error(e)}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function setup(){const [w,h]=size[mode()];out.width=w;out.height=h;octx.fillStyle='#050505';octx.fillRect(0,0,w,h);live.width=v.videoWidth||1280;live.height=v.videoHeight||720;cursor=rev()?(mode()==='vertical'?w:h):0;$('bar').style.width='0%';has=false;$('empty').style.display='grid'}function start(e){e&&e.preventDefault();if(!stream||scanning)return;setup();scanning=true;last=0;$('shutter').classList.add('on');$('status').textContent='Scanning, keep moving slowly.';navigator.vibrate&&navigator.vibrate(20);raf=requestAnimationFrame(loop)}function stop(e){e&&e.preventDefault();if(!scanning)return;scanning=false;cancelAnimationFrame(raf);$('shutter').classList.remove('on');$('status').textContent=has?'Trace complete. Save or retake.':'Ready. Hold the shutter to trace.';navigator.vibrate&&navigator.vibrate([18,40,18])}function loop(t){if(!scanning)return;if(t-last>=1000/60){capture();last=t}raf=requestAnimationFrame(loop)}function capture(){const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;if(live.width!==vw||live.height!==vh){live.width=vw;live.height=vh}lctx.drawImage(v,0,0,vw,vh);const sw=slit(),step=Math.max(1,sw*speed()),g=glitch();if(mode()==='vertical'){const sx=Math.floor(vw/2-sw/2),px=rev()?cursor-step:cursor,jy=Math.random()<g?Math.round((Math.random()-.5)*34):0;octx.save();octx.globalAlpha=Math.random()<g?.88+Math.random()*.24:1;octx.drawImage(live,sx,0,sw,vh,px,jy,step,out.height);octx.restore();cursor+=rev()?-step:step;progress(rev()?(out.width-cursor)/out.width:cursor/out.width);if((!rev()&&cursor>=out.width)||(rev()&&cursor<=0))stop()}else{const sy=Math.floor(vh/2-sw/2),py=rev()?cursor-step:cursor,jx=Math.random()<g?Math.round((Math.random()-.5)*34):0;octx.save();octx.globalAlpha=Math.random()<g?.88+Math.random()*.24:1;octx.drawImage(live,0,sy,vw,sw,jx,py,out.width,step);octx.restore();cursor+=rev()?-step:step;progress(rev()?(out.height-cursor)/out.height:cursor/out.height);if((!rev()&&cursor>=out.height)||(rev()&&cursor<=0))stop()}has=true;$('empty').style.display='none'}function progress(x){$('bar').style.width=(Math.max(0,Math.min(1,x))*100)+'%'}function retake(){stop();setup();$('status').textContent='Ready. Hold the shutter to trace.'}function save(){if(!has){$('status').textContent='Make a trace first.';return}out.toBlob(async b=>{if(!b)return;const name='tracecam-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png',file=new File([b],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'TraceCam scan'});return}catch(e){}}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;a.click()},'image/png',1)}function bind(btn){btn.addEventListener('pointerdown',start);btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('pointerleave',stop);btn.addEventListener('touchstart',start,{passive:false});btn.addEventListener('touchend',stop,{passive:false})}$('start').onclick=camera;$('restart').onclick=camera;$('retake').onclick=retake;$('save').onclick=save;bind($('shutter'));['mode','dir','width','speed','glitch'].forEach(id=>$(id).addEventListener('input',labels));['mode','dir','width','speed','glitch'].forEach(id=>$(id).addEventListener('change',()=>{labels();if(!scanning)retake()}));addEventListener('beforeunload',stopCamera);labels();setup();
</script>
</body>
</html>
