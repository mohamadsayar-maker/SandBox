<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>HandKit Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button{font:inherit}.app{position:fixed;inset:0;background:#080808}.frame{position:absolute;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden;border-radius:26px;background:#151515;transition:.25s}.app.edge .frame{inset:0;border-radius:0}video,canvas,.shade{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;transform:scaleX(-1)}video.contain{object-fit:contain}.shade{pointer-events:none;background:linear-gradient(#0007,transparent 23%,transparent 72%,#0008)}canvas{pointer-events:none}.top{position:absolute;z-index:5;top:max(24px,calc(env(safe-area-inset-top) + 10px));left:max(24px,calc(env(safe-area-inset-left) + 10px));right:max(24px,calc(env(safe-area-inset-right) + 10px));display:flex;justify-content:space-between;gap:12px}.glass{border:1px solid #ffffff20;background:#10101099;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:17px}.brand{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#fff;color:#080808;font-weight:800}.brand b,.brand small{display:block}.brand b{font-size:13px}.brand small{font-size:9px;color:#ffffff80;margin-top:3px}.tools{display:flex;gap:4px;padding:5px;overflow:auto}.tools button{border:0;background:transparent;color:#ffffffad;border-radius:11px;height:38px;padding:0 11px;font-size:10px;font-weight:700}.tools button.on{background:#fff;color:#080808}.start{position:absolute;z-index:7;top:50%;left:50%;width:min(520px,calc(100vw - 40px));transform:translate(-50%,-50%);padding:32px;border:1px solid #ffffff20;border-radius:28px;background:#111d;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 30px 100px #0008}.start.hide{display:none}.start .hand{display:grid;place-items:center;width:56px;height:56px;border-radius:17px;background:#fff;font-size:28px;filter:grayscale(1)}.start h1{font-size:clamp(36px,6vw,56px);line-height:.96;letter-spacing:-.055em;margin:24px 0 16px}.start p{color:#ffffffaa;line-height:1.5;font-size:14px}.start button{width:100%;height:54px;border:0;border-radius:16px;background:#fff;color:#080808;font-weight:750;margin-top:10px}.dock{position:absolute;z-index:5;left:50%;bottom:max(25px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);display:none;gap:6px;align-items:center;max-width:calc(100vw - 32px)}.dock.show{display:flex}.pill{padding:10px 13px;border-radius:14px;background:#101010a8;border:1px solid #ffffff20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:10px;color:#ffffff9c;white-space:nowrap}.pill.on{background:#fff;color:#080808}.debug{position:absolute;z-index:8;right:max(24px,calc(env(safe-area-inset-right) + 10px));top:max(90px,calc(env(safe-area-inset-top) + 76px));width:270px;padding:16px;display:none}.debug.show{display:block}.debug h3{font-size:12px;margin:0 0 12px}.metric{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #ffffff12;font-size:10px}.metric span:first-child{color:#ffffff70}.error{position:absolute;z-index:20;left:50%;top:95px;transform:translateX(-50%);max-width:calc(100vw - 40px);padding:11px 15px;border-radius:13px;background:#511e;color:#ffd7d7;border:1px solid #ff8c8c55;font-size:11px;display:none}.error.show{display:block}@media(max-width:700px){.brand small{display:none}.tools{max-width:calc(100vw - 88px)}.tools button{padding:0 9px}.debug{left:14px;right:14px;top:auto;bottom:85px;width:auto}.start{padding:25px}.dock{overflow:auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="frame" id="frame"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div class="shade"></div></div>
  <div class="top"><div class="brand glass"><span class="mark">H</span><span><b>HandKit</b><small id="status">Ready</small></span></div><div class="tools glass"><button id="edge">Frame</button><button id="fit">Cover</button><button id="mirror" class="on">Mirror</button><button id="skeleton" class="on">Skeleton</button><button id="debugBtn">Debug</button></div></div>
  <div class="start" id="start"><div class="hand">✋</div><h1>Your camera becomes the interface.</h1><p>First iPad test: full-screen video, two-hand landmarks, pinch and open-palm detection. Everything is processed on your device.</p><button id="startBtn">Start camera</button></div>
  <div class="dock" id="dock"><span class="pill" id="hands">Show your hands</span><span class="pill" id="pinch">Pinch 0%</span><span class="pill" id="open">Open 0%</span></div>
  <div class="debug glass" id="debug"><h3>Diagnostics</h3><div class="metric"><span>Camera</span><span id="cameraM">–</span></div><div class="metric"><span>Video</span><span id="videoM">0 FPS</span></div><div class="metric"><span>Tracking</span><span id="trackM">0 FPS</span></div><div class="metric"><span>Inference</span><span id="inferM">–</span></div><div class="metric"><span>Hands</span><span id="handM">0</span></div><div class="metric"><span>Delegate</span><span id="delegateM">–</span></div></div>
  <div class="error" id="error"></div>
</div>
<script type="module">
import{FilesetResolver,HandLandmarker}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm';
const $=s=>document.querySelector(s),app=$('#app'),frame=$('#frame'),video=$('#video'),canvas=$('#overlay'),ctx=canvas.getContext('2d'),start=$('#start'),startBtn=$('#startBtn'),dock=$('#dock'),status=$('#status'),error=$('#error'),hands=$('#hands'),pinch=$('#pinch'),open=$('#open');
const con=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let tracker=null,running=false,busy=false,mirror=true,fit='cover',showSkeleton=true,lastVideoTime=-1,lastRun=0,result=null,vFrames=0,tFrames=0,vFps=0,tFps=0,lastMetrics=performance.now(),inference=0,delegate='GPU';
function fail(message){error.textContent=message;error.classList.add('show');status.textContent='Error';setTimeout(()=>error.classList.remove('show'),8000)}
function resize(){const r=frame.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px'}
function map(p){const r=frame.getBoundingClientRect(),sw=video.videoWidth||1,sh=video.videoHeight||1,s=fit==='cover'?Math.max(r.width/sw,r.height/sh):Math.min(r.width/sw,r.height/sh),rw=sw*s,rh=sh*s,ox=(r.width-rw)/2,oy=(r.height-rh)/2,x=(mirror?1-p.x:p.x);return{x:ox+x*rw,y:oy+p.y*rh}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z-b.z)*.35)}
function gestures(l){const palm=Math.max(dist(l[5],l[17]),.02),pd=dist(l[4],l[8])/palm,ps=Math.max(0,Math.min(1,1-(pd-.18)/.65));const ext=(tip,pip,mcp)=>{const a=dist(l[tip],l[0]),b=dist(l[pip],l[0]),c=dist(l[mcp],l[0]);return Math.max(0,Math.min(1,(a-b)/(Math.max(b-c,.0001)*1.5)+.35))};const os=Math.min(1,(ext(8,6,5)+ext(12,10,9)+ext(16,14,13)+ext(20,18,17))/3.7);return{pinch:ps,open:os}}
function draw(){requestAnimationFrame(draw);resize();ctx.clearRect(0,0,canvas.width,canvas.height);if(!result)return;const r=frame.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);ctx.save();ctx.scale(d,d);for(const l of result.landmarks){const pts=l.map(map),g=gestures(l);if(showSkeleton){ctx.lineCap='round';ctx.strokeStyle='#ffffffbb';ctx.lineWidth=2;ctx.beginPath();for(const[a,b]of con){ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y)}ctx.stroke();pts.forEach((p,i)=>{ctx.beginPath();ctx.fillStyle=[4,8,12,16,20].includes(i)?'#fff':'#ffffffc8';ctx.arc(p.x,p.y,[4,8,12,16,20].includes(i)?4.5:2.5,0,Math.PI*2);ctx.fill()})}if(g.pinch>.3){const a=pts[4],b=pts[8];ctx.beginPath();ctx.strokeStyle=g.pinch>.72?'#fff':'#ffffff88';ctx.lineWidth=g.pinch>.72?5:2;ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,12+g.pinch*18,0,Math.PI*2);ctx.stroke()}}ctx.restore()}
async function initTracker(){status.textContent='Loading hand model…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm');const make=d=>HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5});try{tracker=await make('GPU');delegate='GPU'}catch(e){tracker=await make('CPU');delegate='CPU'}$('#delegateM').textContent=delegate;status.textContent='Tracking ready'}
async function startCamera(){startBtn.disabled=true;startBtn.textContent='Starting…';try{const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1920,min:1280},height:{ideal:1080,min:720},frameRate:{ideal:30,max:60}}});video.srcObject=stream;await video.play();const s=stream.getVideoTracks()[0].getSettings();$('#cameraM').textContent=`${s.width||video.videoWidth}×${s.height||video.videoHeight} @ ${Math.round(s.frameRate||0)}`;start.classList.add('hide');dock.classList.add('show');running=true;status.textContent='Camera active';initTracker().catch(e=>fail('Model failed: '+e));loop()}catch(e){startBtn.disabled=false;startBtn.textContent='Try again';fail(e.message||String(e))}}
function loop(now=performance.now()){if(!running)return;vFrames++;if(tracker&&!busy&&video.currentTime!==lastVideoTime&&now-lastRun>45){busy=true;lastVideoTime=video.currentTime;lastRun=now;const t=performance.now();try{result=tracker.detectForVideo(video,now);inference=performance.now()-t;tFrames++;const count=result.landmarks.length,$g=count?gestures(result.landmarks[0]):{pinch:0,open:0};hands.textContent=count?`${count} hand${count>1?'s':''}`:'Show your hands';pinch.textContent=`Pinch ${Math.round($g.pinch*100)}%`;open.textContent=`Open ${Math.round($g.open*100)}%`;pinch.classList.toggle('on',$g.pinch>.72);open.classList.toggle('on',$g.open>.72);$('#handM').textContent=count}catch(e){fail('Tracking failed: '+e)}busy=false}requestAnimationFrame(loop)}
setInterval(()=>{const now=performance.now(),dt=now-lastMetrics;vFps=Math.round(vFrames*1000/dt);tFps=Math.round(tFrames*1000/dt);vFrames=tFrames=0;lastMetrics=now;$('#videoM').textContent=vFps+' FPS';$('#trackM').textContent=tFps+' FPS';$('#inferM').textContent=inference?inference.toFixed(1)+' ms':'–'},1000);
startBtn.onclick=startCamera;$('#edge').onclick=e=>{app.classList.toggle('edge');e.currentTarget.textContent=app.classList.contains('edge')?'Edge':'Frame'};$('#fit').onclick=e=>{fit=fit==='cover'?'contain':'cover';video.classList.toggle('contain',fit==='contain');e.currentTarget.textContent=fit[0].toUpperCase()+fit.slice(1)};$('#mirror').onclick=e=>{mirror=!mirror;video.style.transform=mirror?'scaleX(-1)':'none';e.currentTarget.classList.toggle('on',mirror)};$('#skeleton').onclick=e=>{showSkeleton=!showSkeleton;e.currentTarget.classList.toggle('on',showSkeleton)};$('#debugBtn').onclick=e=>{$('#debug').classList.toggle('show');e.currentTarget.classList.toggle('on')};addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();draw();
</script>
</body>
</html>
